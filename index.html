<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For My Love ❤️</title>
<style>
body{
margin:0;
font-family:Arial,sans-serif;
background:linear-gradient(135deg,#ff9a9e,#fad0c4);
display:flex;
justify-content:center;
align-items:center;
height:100vh;
text-align:center;
color:white;
}
.card{
background:rgba(255,255,255,0.15);
padding:30px;
border-radius:20px;
backdrop-filter:blur(10px);
max-width:500px;
margin:20px;
}
h1{font-size:2.2em;}
p{font-size:1.2em;line-height:1.6;}
button{
padding:12px 24px;
font-size:18px;
border:none;
border-radius:30px;
cursor:pointer;
background:white;
color:#ff4d6d;
font-weight:bold;
}
</style>
</head>
<body>
<div class="card">
<h1>❤️ To My Momo ❤️</h1>
<p>
Every moment with you is my favourite memory.<br><br>
You make my life brighter, happier, and more beautiful.
</p>
<button onclick="alert('I Love You Forever ❤️')">Click Me</button>
</div>
</body>
</html>
